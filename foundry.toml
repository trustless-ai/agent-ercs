[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.25"
evm_version = "cancun"

# OpenZeppelin dependency remappings
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# Allow multiple Solidity versions (each ERC may pin its own)
# See https://book.getfoundry.sh/reference/forge/forge-build
